<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GESU — Документы</title>
<style>
  :root{
    --bg:#F5F2EC; --bg-deep:#EFEAE0; --ink:#1A1814; --ink-soft:#3A352E;
    --warm-gray:#8A8680; --hairline:rgba(26,24,20,0.12);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.6;
  }
  .wrap{max-width:720px; margin:0 auto; padding:56px 24px 80px}
  .logo{
    font-size:20px; font-weight:500; letter-spacing:0.28em;
    text-align:center; margin:0;
  }
  .brand-line{
    font-size:10px; letter-spacing:0.3em; color:var(--warm-gray);
    text-align:center; margin:12px 0 0; text-transform:uppercase;
  }
  hr{border:0; border-top:1px solid var(--hairline); margin:40px 0}
  h1{
    font-family:"Cormorant Garamond","Times New Roman",serif;
    font-size:26px; font-weight:400; letter-spacing:-0.3px;
    margin:0 0 32px;
  }
  .nav{list-style:none; padding:0; margin:0}
  .nav li{border-bottom:1px solid var(--hairline)}
  .nav a{
    display:block; padding:20px 0; color:var(--ink);
    text-decoration:none; font-size:15px;
  }
  .nav a:hover{color:var(--warm-gray)}
  .nav .meta{
    display:block; font-size:11px; letter-spacing:0.22em;
    color:var(--warm-gray); text-transform:uppercase; margin-top:6px;
  }
  footer{
    margin-top:56px; padding-top:24px; border-top:1px solid var(--hairline);
    text-align:center; font-size:10px; letter-spacing:0.3em;
    color:var(--warm-gray); text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="logo">GESU</p>
  <p class="brand-line">Dushanbe | Est. 2024</p>
  <hr>
  <h1>Документы</h1>
  <ul class="nav">
    <li><a href="privacy-policy.html">Политика конфиденциальности<span class="meta">Privacy Policy</span></a></li>
    <li><a href="terms-of-service.html">Пользовательское соглашение<span class="meta">Terms of Service</span></a></li>
    <li><a href="delete-account.html">Удаление аккаунта<span class="meta">Delete account</span></a></li>
  </ul>
  <!-- auth-confirmed.html и auth-reset.html в списке не показываем:
       это служебные страницы для редиректов Supabase, не документы. -->
  <footer>GESU · Dushanbe | Est. 2024</footer>
</div>
</body>
</html>
